<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZTNA architecture — admission, inspection and re-evaluation</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--color-muted); margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400; letter-spacing: -0.02em; line-height: 1.15;
      color: var(--color-ink); margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Secure paved road</p>
    <h1>One route in, inspected in the clear, and re-judged every ten seconds</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ztna-arch-title ztna-arch-desc">
        <title id="ztna-arch-title">ZTNA architecture — admission, inspection and re-evaluation</title>
        <desc id="ztna-arch-desc">An enrolled client is admitted by a post-quantum knock, its TLS is terminated and inspected by the gateway before the request is forwarded in cleartext to the resource, and the policy controller running in the same process re-scores live sessions every ten seconds; an unenrolled host is dropped at the perimeter and the trained detector is not yet feeding the controller.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- ============ zones ============ -->
        <rect x="30" y="76" width="200" height="454" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8" stroke-dasharray="6,4"/>
        <rect x="42" y="80" width="78" height="12" rx="2" fill="#f5f5f5"/>
        <text x="46" y="89" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">UNTRUSTED</text>

        <rect x="268" y="76" width="180" height="454" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="280" y="80" width="96" height="12" rx="2" fill="#f5f5f5"/>
        <text x="284" y="89" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">CONTROL PLANE</text>

        <rect x="496" y="76" width="434" height="454" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="508" y="80" width="214" height="12" rx="2" fill="#f5f5f5"/>
        <text x="512" y="89" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">PROTECTED ENCLAVE · DEFAULT DROP</text>

        <!-- ============ connectors ============ -->

        <!-- Client -> IDP -->
        <line x1="206" y1="148" x2="275" y2="148" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="221" y="128" width="38" height="12" rx="2" fill="#f5f5f5"/>
        <text x="240" y="137" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">FIDO2</text>

        <!-- IDP -> Gateway : mTLS, key registration + JWKS -->
        <path d="M 433,140 H 572 Q 580,140 580,148 V 160" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <rect x="464" y="120" width="36" height="12" rx="2" fill="#f5f5f5"/>
        <text x="482" y="129" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">MTLS</text>

        <!-- Client -> Gateway : the SPA knock (HEADLINE) -->
        <path d="M 206,164 H 232 Q 240,164 240,172 V 242 Q 240,250 248,250 H 512" fill="none" stroke="#bf4520" stroke-width="1.6" marker-end="url(#arrow-accent)"/>
        <rect x="326" y="230" width="98" height="12" rx="2" fill="#f5f5f5"/>
        <text x="375" y="239" fill="#bf4520" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">SPA KNOCK · TLS</text>

        <!-- Gateway -> Resource : cleartext inner leg -->
        <line x1="655" y1="320" x2="655" y2="396" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="665" y="346" width="62" height="12" rx="2" fill="#f5f5f5"/>
        <text x="665" y="355" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.06em">PLAIN HTTP</text>

        <!-- Detector -> Controller : NOT WIRED -->
        <path d="M 820,400 V 312" fill="none" stroke="#bf4520" stroke-width="1.2" stroke-dasharray="2,3" marker-end="url(#arrow-accent)"/>
        <rect x="830" y="346" width="62" height="12" rx="2" fill="#f5f5f5"/>
        <text x="830" y="355" fill="#bf4520" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.06em">NOT WIRED</text>

        <!-- Unenrolled host : forbidden ingress -->
        <line x1="206" y1="458" x2="484" y2="458" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
        <line x1="492" y1="444" x2="492" y2="472" stroke="#2d3142" stroke-width="3"/>
        <rect x="302" y="438" width="76" height="12" rx="2" fill="#f5f5f5"/>
        <text x="340" y="447" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">NO KNOCK</text>
        <rect x="504" y="452" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="504" y="461" fill="#2d3142" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.06em">DROPPED</text>

        <!-- ============ nodes ============ -->

        <!-- Client -->
        <rect x="56" y="120" width="150" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="56" y="120" width="150" height="56" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
        <rect x="64" y="126" width="46" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="87" y="135" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">ENROLLED</text>
        <text x="131" y="156" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">SDP Client</text>
        <text x="131" y="169" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">tpm anchor</text>

        <!-- Unenrolled -->
        <rect x="56" y="430" width="150" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="56" y="430" width="150" height="56" rx="6" fill="#f5f5f5" stroke="rgba(45,49,66,0.45)" stroke-width="1" stroke-dasharray="4,3"/>
        <rect x="64" y="436" width="42" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="85" y="445" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">SCANNER</text>
        <text x="131" y="466" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Unenrolled Host</text>
        <text x="131" y="479" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">no ticket</text>

        <!-- IDP -->
        <rect x="283" y="120" width="150" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="283" y="120" width="150" height="56" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
        <rect x="291" y="126" width="26" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="304" y="135" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">IDP</text>
        <text x="358" y="156" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Identity Provider</text>
        <text x="358" y="169" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">posture attested</text>

        <!-- Gateway container -->
        <rect x="520" y="160" width="360" height="160" rx="6" fill="#f5f5f5"/>
        <rect x="520" y="160" width="360" height="160" rx="6" fill="#ececec" stroke="#2d3142" stroke-width="1.4"/>
        <rect x="528" y="166" width="26" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="541" y="175" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">PEP</text>
        <text x="566" y="176" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">SDP Gateway — one process</text>

        <!-- Gateway: data path -->
        <rect x="536" y="196" width="160" height="108" rx="6" fill="#f5f5f5" stroke="rgba(45,49,66,0.55)" stroke-width="1"/>
        <text x="616" y="218" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Data path</text>
        <text x="548" y="238" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">nftables default-DROP</text>
        <text x="548" y="254" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">SPA listener :62201</text>
        <text x="548" y="270" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">TLS proxy :443</text>
        <text x="548" y="286" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">inspect decrypted</text>

        <!-- Gateway: controller -->
        <rect x="712" y="196" width="152" height="108" rx="6" fill="#f5f5f5" stroke="rgba(45,49,66,0.55)" stroke-width="1"/>
        <text x="788" y="218" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Controller</text>
        <text x="724" y="238" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">trust score 0-100</text>
        <text x="724" y="254" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">13 policy rules</text>
        <text x="724" y="270" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">re-scores every 10s</text>
        <text x="724" y="286" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">revokes live sessions</text>

        <!-- Resource -->
        <rect x="580" y="396" width="150" height="60" rx="6" fill="#f5f5f5"/>
        <rect x="580" y="396" width="150" height="60" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
        <rect x="588" y="402" width="26" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="601" y="411" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">SVC</text>
        <text x="655" y="432" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Resource</text>
        <text x="655" y="445" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">http · verifies token</text>

        <!-- Detector, not wired -->
        <rect x="770" y="396" width="150" height="60" rx="6" fill="#f5f5f5"/>
        <rect x="770" y="396" width="150" height="60" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.6" stroke-dasharray="5,4"/>
        <rect x="778" y="402" width="54" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.40)" stroke-width="0.8"/>
        <text x="805" y="411" fill="#bf4520" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">NOT WIRED</text>
        <text x="845" y="432" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">FLAT_cal + AE</text>
        <text x="845" y="445" fill="#bf4520" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">trained, offline</text>

        <!-- ============ legend ============ -->
        <line x1="30" y1="560" x2="930" y2="560" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="30" y="578" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text>

        <line x1="108" y1="574" x2="136" y2="574" stroke="#bf4520" stroke-width="1.6" marker-end="url(#arrow-accent)"/>
        <text x="144" y="578" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">PERMITTED INGRESS</text>

        <line x1="296" y1="574" x2="324" y2="574" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
        <line x1="326" y1="568" x2="326" y2="580" stroke="#2d3142" stroke-width="3"/>
        <text x="338" y="578" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">BLOCKED AT PERIMETER</text>

        <line x1="540" y1="574" x2="568" y2="574" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <text x="576" y="578" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">MTLS CONTROL LINK</text>

        <line x1="756" y1="574" x2="784" y2="574" stroke="#bf4520" stroke-width="1.2" stroke-dasharray="2,3" marker-end="url(#arrow-accent)"/>
        <text x="792" y="578" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">NOT BUILT YET</text>
      </svg>
    </div>
  </div>
</body>
</html>
