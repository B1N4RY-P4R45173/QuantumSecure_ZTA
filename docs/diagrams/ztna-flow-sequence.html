<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZTNA access flow — current state</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--color-muted); margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400; letter-spacing: -0.02em; line-height: 1.15;
      color: var(--color-ink); margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · Quantum-Secure ZTNA</p>
    <h1>Access flow as built — boot, admission, then an inspected request</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 666" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ztna-seq-title ztna-seq-desc">
        <title id="ztna-seq-title">ZTNA access flow — current state</title>
        <desc id="ztna-seq-desc">A client authenticates to the identity provider with FIDO2 and receives a knock ticket carrying its attested device posture, opens a firewall pinhole with a single post-quantum UDP knock that the policy controller scores and approves, then sends its request over TLS which the gateway terminates, inspects in the clear and forwards to the resource.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- ============ lifelines ============ -->
        <line x1="108" y1="112" x2="108" y2="566" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="294" y1="112" x2="294" y2="566" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="480" y1="112" x2="480" y2="566" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="666" y1="112" x2="666" y2="566" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="852" y1="112" x2="852" y2="566" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

        <!-- ============ phase rules ============ -->
        <line x1="33" y1="132" x2="927" y2="132" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
        <rect x="33" y="126" width="128" height="12" rx="2" fill="#f5f5f5"/>
        <text x="37" y="135" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">STARTUP · ONCE AT BOOT</text>

        <line x1="33" y1="208" x2="927" y2="208" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
        <rect x="33" y="202" width="118" height="12" rx="2" fill="#f5f5f5"/>
        <text x="37" y="211" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">PER ACCESS REQUEST</text>

        <!-- ============ activation bars ============ -->
        <rect x="290" y="160" width="8" height="24" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
        <rect x="290" y="236" width="8" height="96" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
        <rect x="476" y="372" width="8" height="116" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
        <rect x="662" y="424" width="8" height="32" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
        <rect x="476" y="520" width="8" height="22" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

        <!-- ============ messages (arrows before boxes) ============ -->

        <!-- 1. Gateway -> IDP : register KEM key -->
        <line x1="480" y1="160" x2="302" y2="160" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <rect x="353" y="140" width="68" height="12" rx="2" fill="#f5f5f5"/>
        <text x="387" y="149" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">REGISTER KEM</text>

        <!-- 2. IDP -> Gateway : JWKS (return) -->
        <line x1="294" y1="184" x2="472" y2="184" stroke="#2e5aa8" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-link)"/>
        <rect x="369" y="164" width="36" height="12" rx="2" fill="#f5f5f5"/>
        <text x="387" y="173" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">JWKS</text>

        <!-- 3. Client -> IDP : password -->
        <line x1="108" y1="236" x2="286" y2="236" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="175" y="216" width="52" height="12" rx="2" fill="#f5f5f5"/>
        <text x="201" y="225" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">PASSWORD</text>

        <!-- 4. IDP -> Client : login token (return) -->
        <line x1="290" y1="268" x2="116" y2="268" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <rect x="167" y="248" width="68" height="12" rx="2" fill="#f5f5f5"/>
        <text x="201" y="257" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">LOGIN TOKEN</text>

        <!-- 5. Client -> IDP : FIDO2 ceremony -->
        <line x1="108" y1="300" x2="286" y2="300" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="167" y="280" width="68" height="12" rx="2" fill="#f5f5f5"/>
        <text x="201" y="289" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">FIDO2 + TPM</text>

        <!-- 6. IDP -> Client : tokens + gateway key + ticket (return) -->
        <line x1="290" y1="332" x2="116" y2="332" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <rect x="163" y="312" width="76" height="12" rx="2" fill="#f5f5f5"/>
        <text x="201" y="321" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">TOKEN + KEY</text>

        <!-- 7. Client -> Gateway : SPA knock  (HEADLINE) -->
        <line x1="108" y1="372" x2="472" y2="372" stroke="#bf4520" stroke-width="1.6" marker-end="url(#arrow-accent)"/>
        <rect x="265" y="352" width="58" height="12" rx="2" fill="#f5f5f5"/>
        <text x="294" y="361" fill="#bf4520" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">SPA KNOCK</text>

        <!-- gateway guard note -->
        <rect x="492" y="382" width="96" height="12" rx="2" fill="#f5f5f5"/>
        <text x="492" y="391" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.04em">6 GUARD CHECKS</text>

        <!-- 8. Gateway -> Controller : SPA_VERIFY -->
        <line x1="484" y1="424" x2="658" y2="424" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="542" y="404" width="62" height="12" rx="2" fill="#f5f5f5"/>
        <text x="573" y="413" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">SPA_VERIFY</text>

        <!-- 9. Controller -> Gateway : APPROVED (return) -->
        <line x1="662" y1="456" x2="488" y2="456" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <rect x="547" y="436" width="52" height="12" rx="2" fill="#f5f5f5"/>
        <text x="573" y="445" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">APPROVED</text>

        <!-- 10. Gateway -> Client : SPA_OK (return) -->
        <line x1="476" y1="488" x2="116" y2="488" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <rect x="273" y="468" width="42" height="12" rx="2" fill="#f5f5f5"/>
        <text x="294" y="477" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">SPA_OK</text>

        <!-- 11. Client -> Gateway : the request, over TLS through the pinhole -->
        <line x1="108" y1="520" x2="472" y2="520" stroke="#bf4520" stroke-width="1.6" marker-end="url(#arrow-accent)"/>
        <rect x="259" y="500" width="70" height="12" rx="2" fill="#f5f5f5"/>
        <text x="294" y="509" fill="#bf4520" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">TLS REQUEST</text>

        <!-- what the gateway does between receiving and forwarding -->
        <rect x="492" y="498" width="128" height="12" rx="2" fill="#f5f5f5"/>
        <text x="492" y="507" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.04em">DECRYPT · INSPECT · RE-CHECK LEASE</text>

        <!-- 12. Gateway -> Resource : terminated, inspected, re-forwarded in the clear -->
        <line x1="484" y1="542" x2="844" y2="542" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="631" y="522" width="66" height="12" rx="2" fill="#f5f5f5"/>
        <text x="664" y="531" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">PLAIN HTTP</text>

        <!-- ============ actor boxes (drawn last) ============ -->

        <!-- Client -->
        <rect x="33" y="56" width="150" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="33" y="56" width="150" height="56" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
        <rect x="41" y="62" width="34" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="58" y="71" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">AGENT</text>
        <text x="108" y="92" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">SDP Client</text>
        <text x="108" y="105" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">tpm · usb key</text>

        <!-- IDP -->
        <rect x="219" y="56" width="150" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="219" y="56" width="150" height="56" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
        <rect x="227" y="62" width="26" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="240" y="71" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">IDP</text>
        <text x="294" y="92" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Identity Provider</text>
        <text x="294" y="105" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">:9000 · fido2</text>

        <!-- Gateway -->
        <rect x="405" y="56" width="150" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="405" y="56" width="150" height="56" rx="6" fill="#ececec" stroke="#2d3142" stroke-width="1"/>
        <rect x="413" y="62" width="26" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="426" y="71" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">PEP</text>
        <text x="480" y="92" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">SDP Gateway</text>
        <text x="480" y="105" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">:62201 udp</text>

        <!-- Controller (FOCAL — the stub) -->
        <rect x="591" y="56" width="150" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="591" y="56" width="150" height="56" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
        <rect x="599" y="62" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="619" y="71" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">POLICY</text>
        <text x="666" y="92" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">SDP Controller</text>
        <text x="666" y="105" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">trust + 13 rules</text>

        <!-- Resource -->
        <rect x="777" y="56" width="150" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="777" y="56" width="150" height="56" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
        <rect x="785" y="62" width="26" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="798" y="71" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">SVC</text>
        <text x="852" y="92" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Resource Node</text>
        <text x="852" y="105" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">python server</text>

        <!-- ============ legend ============ -->
        <line x1="33" y1="598" x2="927" y2="598" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="33" y="616" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text>

        <line x1="110" y1="612" x2="138" y2="612" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="146" y="616" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">CALL</text>

        <line x1="206" y1="612" x2="234" y2="612" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <text x="242" y="616" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">RETURN</text>

        <line x1="318" y1="612" x2="346" y2="612" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <text x="354" y="616" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">MTLS TO IDP</text>

        <line x1="470" y1="612" x2="498" y2="612" stroke="#bf4520" stroke-width="1.6" marker-end="url(#arrow-accent)"/>
        <text x="506" y="616" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">CLIENT ENCRYPTED LEG</text>
      </svg>
    </div>
  </div>
</body>
</html>
