services:

  # Standalone Identity Provider. Deliberately NOT on data-plane-net: the
  # IDP must have no route to the resource nodes. It shares idp-net with the
  # client and with the Gateway, which consults its JWKS — consultation only
  # ever runs toward the IDP, never out of it. Port 9000 is published to the
  # host so a native (e.g. Windows) client can reach it too.
  sdp-idp:
    build:
      context: .
      dockerfile: ./docker/idp/Dockerfile
    image: sdp-idp:latest
    container_name: sdp-idp
    env_file: .env
    environment:
      - IDP_HOST=0.0.0.0
      - IDP_PORT=9000
      - IDP_GATEWAY_LINK_PORT=9443
    # Run as the host user that owns the bind mounts below. The image's own
    # `idp` user is uid 10001, which cannot write to a host directory owned
    # by someone else — SQLite fails with "attempt to write a readonly
    # database" and the IDP crash-loops. The whole point of these mounts is
    # that a container run and a native run share one identity, so the
    # container has to write as the mount's owner.
    # Override on a host where you are not uid 1000:
    #   HOST_UID=$(id -u) HOST_GID=$(id -g) docker compose up
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    ports:
      - "9000:9000"
      # Gateway-only mTLS link: Gateways register their ML-KEM public key and
      # fetch the JWKS here. Published so a Gateway on another machine can
      # reach it; without a CA-issued Gateway certificate it accepts nothing.
      - "9443:9443"
    volumes:
      # The host's own IDP state, so the container and a native run share one
      # identity: accounts, enrolled credentials, signing keys, and the CA +
      # IDP certificate from admin_cli.py init-ca / issue-idp-cert (for a
      # Gateway on the compose network, issue it with --host sdp-idp too).
      - ./IDENTITY_PROVIDER/data:/app/IDENTITY_PROVIDER/data
      - ./IDENTITY_PROVIDER/certs:/app/IDENTITY_PROVIDER/certs
    networks:
      - idp-net
    restart: unless-stopped

  # The Policy Decision Point, split out of the Gateway process. It holds the
  # policy file, the telemetry snapshot and the trust scorer, and answers
  # SPA_VERIFY and SESSION_REVIEW over mutual TLS.
  #
  # On controller-net ALONE, and that is the whole point of the service:
  #   * not data-plane-net — it rules on access to the resources and has no
  #     route to them, so owning the decision does not hand you the data;
  #   * not client-net — nothing a client can reach decides whether that
  #     client gets in;
  #   * no published port — the only way in is from the Gateway, holding a
  #     certificate this project's CA signed. Reaching the port buys nothing
  #     without one.
  #
  # Needs no capability and no host uid pin: it binds a high port, writes
  # nothing, and every mount below is read-only, so the image's own non-root
  # `controller` user is enough.
  sdp-controller:
    build:
      context: .
      dockerfile: ./docker/controller/Dockerfile
    image: sdp-controller:latest
    container_name: sdp-controller
    env_file: .env
    # Run as the host user that owns the mounted key bundle. controller.key
    # is 0600 by design — a private key readable by anyone on the host would
    # be the worse bug — so the image's own unprivileged user cannot read it
    # through a bind mount and the service aborts with PermissionError. Same
    # reasoning, and the same override, as the IDP above.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    volumes:
      # The bundle from `admin_cli.py issue-controller-cert`: ca.crt,
      # controller.crt/.key (what it presents to a Gateway) and health.crt/.key
      # (the container's own /healthz probe, which is behind the same mTLS).
      # Read-only, and absent until the admin copies it in — in which case the
      # Controller fails to start rather than serving decisions unauthenticated.
      - ./SDP_CONTROLLER/certs/pki:/app/SDP_CONTROLLER/certs/pki:ro
      # The decision inputs, mounted rather than baked into the image so an
      # operator can edit policy or refresh telemetry without a rebuild.
      # Read-only: the Controller reads both and writes neither — the
      # snapshot's writer is the detection pipeline, elsewhere.
      #
      # A DIRECTORY, deliberately, where this used to bind the two files
      # individually. A single-file bind mount follows the INODE, not the
      # path, so the moment anything REPLACES the file rather than writing
      # through it the container keeps reading the old content forever.
      # Almost everything replaces files: vim, VS Code and most editors save
      # to a temporary file and rename it over the original, and so does
      # `git checkout`. The symptom is the worst kind — the Controller goes
      # on serving decisions from stale policy with no error anywhere, and
      # the operator is looking at the new file on the host wondering why it
      # is being ignored.
      #
      # Mounting the directory makes each open() resolve the name again, so
      # a replaced file is picked up. The paths below point here instead of
      # at /app/SDP_CONTROLLER so the image's own copies stay untouched.
      - ./SDP_CONTROLLER:/app/decision-inputs:ro
    environment:
      - CONTROLLER_HOST=0.0.0.0
      - CONTROLLER_PORT=9500
      - CONTROLLER_POLICIES_PATH=/app/decision-inputs/policies.yaml
      - CONTROLLER_TELEMETRY_PATH=/app/decision-inputs/telemetry_snapshot.json
    networks:
      - controller-net
    restart: unless-stopped

  sdp-gateway:
    build:
      context: .
      dockerfile: ./docker/gateway/Dockerfile
    image: sdp-gateway:latest
    container_name: sdp-gateway
    env_file: .env
    environment:
      - GATEWAY_IDP_LINK_URL=https://sdp-idp:9443
      # The decision now runs in its own process. The host must be a name the
      # Controller's certificate carries — issue-controller-cert always covers
      # sdp-controller. Unreachable means every knock is DENIED: the Gateway
      # has no local policy engine left to fall back to.
      - GATEWAY_CONTROLLER_URL=https://sdp-controller:9500
      - RESOURCE_HOST=resource-node
      - RESOURCE_PORT=7443
    # NET_ADMIN to insert nftables rules; NET_BIND_SERVICE to bind the
    # privileged TLS proxy port 443. Deliberately two named capabilities
    # rather than --privileged: without NET_ADMIN the firewall silently
    # demotes to dry-run, which looks like it is working while enforcing
    # nothing.
    cap_add:
      - NET_ADMIN
      - NET_BIND_SERVICE
    # Published for a client running natively on the host rather than in the
    # sdp-client container. That is not a convenience: FIDO2 enrolment needs a
    # TPM, the container has no access to one, so the only client that can
    # complete the full flow is a native one -- and without these two ports it
    # cannot reach the Gateway at all. The knock then goes unanswered and the
    # client reports it as a refused knock, which looks like a policy denial
    # rather than a missing route.
    #
    # Publishing them does not widen the attack surface the way it appears to:
    # the SPA port is the one thing meant to be reachable by an unknown client,
    # and 443 is default-DROP in the Gateway's own nftables table until a knock
    # earns a lease, so it stays dark to anyone who has not authenticated.
    ports:
      - "62201:62201/udp"
      - "443:443/tcp"
    volumes:
      # The bundle from `admin_cli.py issue-gateway-cert --id <id>` and
      # `issue-proxy-cert --id <id>`: ca.crt, gateway.crt/.key (IDP link),
      # proxy.crt/.key (presented to clients).
      - ./SDP_GATEWAY/certs/pki:/app/SDP_GATEWAY/certs/pki:ro
    networks:
      - data-plane-net
      - client-net
      # The Gateway registers its key with the IDP and fetches its JWKS over
      # the mTLS link, so it needs a route to the IDP. The IDP never calls
      # back.
      - idp-net
      # And a route to the Controller, for the same reason and in the same
      # direction: the Gateway asks, the Controller answers, the Controller
      # never dials the Gateway. This is the only service on controller-net
      # besides the Controller itself.
      - controller-net
    depends_on:
      - sdp-idp
      # Not a readiness guarantee — compose only waits for the container to
      # start. It does not need to be: a knock that arrives before the
      # Controller answers is denied, which is the correct answer, not a race.
      - sdp-controller
    restart: unless-stopped

  sdp-client:
    build:
      context: .
      dockerfile: ./docker/client/Dockerfile
    image: sdp-client:latest
    container_name: sdp-client
    env_file: .env
    environment:
      # Both the knock and the TLS data connection go to the Gateway by its
      # compose name; the .env default of 127.0.0.1 would aim them at the
      # client's own container.
      - GATEWAY_IP=sdp-gateway
      - IDP_BASE_URL=http://sdp-idp:9000
    volumes:
      # The project CA — the client's only trust anchor for the Gateway's
      # proxy certificate. Read-only: the client verifies against it and
      # never writes it.
      - ./SDP_GATEWAY/certs/pki/ca.crt:/app/SDP_CLIENT/certs/pki/ca.crt:ro
    networks:
      - client-net
      - idp-net
    depends_on:
      - sdp-idp
      - sdp-gateway
    # NOT restarted, unlike every other service here. The client is an
    # interactive one-shot agent: it prompts for the first factor, then asks
    # the authenticator to sign the WebAuthn challenge. Under "up -d" it has
    # no console, so it aborts on the username prompt -- and with a restart
    # policy it did that every 60 seconds forever, filling the logs and
    # looking like a broken deployment when nothing was wrong.
    #
    # Run it on demand instead, which also gives it the terminal it needs:
    #   docker compose run --rm sdp-client
    # Non-interactively, set CLIENT_USERNAME / CLIENT_PASSWORD in .env (or
    # pass --username/--password); the second factor still needs an enrolled
    # credential, so see the note below.
    #
    # "up" deliberately starts it anyway rather than excluding it from the
    # default profile: it exits once, visibly, instead of being silently
    # absent from "compose ps" when someone expects a client.
    restart: "no"

  resource-node:
    build:
      context: .
      dockerfile: ./docker/resource/Dockerfile
    image: resource-node:latest
    container_name: resource-node
    env_file: .env
    volumes:
      # The IDP's RS256 public key. This node sits on data-plane-net alone and
      # has no route to the IDP, so it cannot fetch the JWKS — it verifies
      # tokens offline against this key, and exits 1 if it is missing rather
      # than serving anything unverified.
      - ./IDENTITY_PROVIDER/certs/idp_jwt_public.pem:/app/resource-node/certs/idp_jwt_public.pem:ro
    networks:
      - data-plane-net
    depends_on:
      - sdp-gateway
    restart: unless-stopped

networks:
  data-plane-net:
    driver: bridge
    internal: true
    name: data-plane-net

  client-net:
    driver: bridge
    internal: true
    name: client-net

  # Client <-> IDP and Gateway -> IDP (JWKS), plus host port publishing and
  # outbound (the IDP is meant to be reachable "globally"). NOT marked
  # internal — an internal-only network cannot publish ports. The IDP stays
  # off data-plane-net, so it has no route to the resource nodes.
  idp-net:
    driver: bridge
    name: idp-net

  # Gateway -> Controller, and nothing else is on it. Internal, so it has no
  # outbound route and publishes no port: the decision service is reachable
  # only from the one component that is allowed to ask it anything. Traffic
  # only ever runs toward the Controller, exactly as on idp-net — the
  # Controller never dials the Gateway back, which is why the Gateway needs no
  # inbound control port at all.
  controller-net:
    driver: bridge
    internal: true
    name: controller-net

