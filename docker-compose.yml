version: "3.9"

services:

  # Standalone Identity Provider. Deliberately NOT on data-plane-net: the
  # IDP must have no route to the resource nodes. It shares idp-net with the
  # client and with the Gateway, which consults its JWKS — consultation only
  # ever runs toward the IDP, never out of it. Port 9000 is published to the
  # host so a native (e.g. Windows) client can reach it too.
  sdp-idp:
    build:
      context: .
      dockerfile: ./docker/idp/Dockerfile
    image: sdp-idp:latest
    container_name: sdp-idp
    env_file: .env
    environment:
      - IDP_HOST=0.0.0.0
      - IDP_PORT=9000
      - IDP_GATEWAY_LINK_PORT=9443
    ports:
      - "9000:9000"
      # Gateway-only mTLS link: Gateways register their ML-KEM public key and
      # fetch the JWKS here. Published so a Gateway on another machine can
      # reach it; without a CA-issued Gateway certificate it accepts nothing.
      - "9443:9443"
    volumes:
      # The host's own IDP state, so the container and a native run share one
      # identity: accounts, enrolled credentials, signing keys, and the CA +
      # IDP certificate from admin_cli.py init-ca / issue-idp-cert (for a
      # Gateway on the compose network, issue it with --host sdp-idp too).
      - ./IDENTITY_PROVIDER/data:/app/IDENTITY_PROVIDER/data
      - ./IDENTITY_PROVIDER/certs:/app/IDENTITY_PROVIDER/certs
    networks:
      - idp-net
    restart: unless-stopped

  sdp-gateway:
    build:
      context: .
      dockerfile: ./docker/gateway/Dockerfile
    image: sdp-gateway:latest
    container_name: sdp-gateway
    env_file: .env
    environment:
      - GATEWAY_IDP_LINK_URL=https://sdp-idp:9443
      - RESOURCE_HOST=resource-node
      - RESOURCE_PORT=7443
    # NET_ADMIN to insert nftables rules; NET_BIND_SERVICE to bind the
    # privileged TLS proxy port 443. Deliberately two named capabilities
    # rather than --privileged: without NET_ADMIN the firewall silently
    # demotes to dry-run, which looks like it is working while enforcing
    # nothing.
    cap_add:
      - NET_ADMIN
      - NET_BIND_SERVICE
    volumes:
      # The bundle from `admin_cli.py issue-gateway-cert --id <id>` and
      # `issue-proxy-cert --id <id>`: ca.crt, gateway.crt/.key (IDP link),
      # proxy.crt/.key (presented to clients).
      - ./SDP_GATEWAY/certs/pki:/app/SDP_GATEWAY/certs/pki:ro
    networks:
      - data-plane-net
      - client-net
      # The Gateway registers its key with the IDP and fetches its JWKS over
      # the mTLS link, so it needs a route to the IDP. The IDP never calls
      # back.
      - idp-net
    depends_on:
      - sdp-idp
    restart: unless-stopped

  sdp-client:
    build:
      context: .
      dockerfile: ./docker/client/Dockerfile
    image: sdp-client:latest
    container_name: sdp-client
    env_file: .env
    environment:
      # Both the knock and the TLS data connection go to the Gateway by its
      # compose name; the .env default of 127.0.0.1 would aim them at the
      # client's own container.
      - GATEWAY_IP=sdp-gateway
      - IDP_BASE_URL=http://sdp-idp:9000
    volumes:
      # The project CA — the client's only trust anchor for the Gateway's
      # proxy certificate. Read-only: the client verifies against it and
      # never writes it.
      - ./SDP_GATEWAY/certs/pki/ca.crt:/app/SDP_CLIENT/certs/pki/ca.crt:ro
    networks:
      - client-net
      - idp-net
    depends_on:
      - sdp-idp
      - sdp-gateway
    restart: unless-stopped

  resource-node:
    build:
      context: .
      dockerfile: ./docker/resource/Dockerfile
    image: resource-node:latest
    container_name: resource-node
    env_file: .env
    volumes:
      # The IDP's RS256 public key. This node sits on data-plane-net alone and
      # has no route to the IDP, so it cannot fetch the JWKS — it verifies
      # tokens offline against this key, and exits 1 if it is missing rather
      # than serving anything unverified.
      - ./IDENTITY_PROVIDER/certs/idp_jwt_public.pem:/app/resource-node/certs/idp_jwt_public.pem:ro
    networks:
      - data-plane-net
    depends_on:
      - sdp-gateway
    restart: unless-stopped

networks:
  data-plane-net:
    driver: bridge
    internal: true
    name: data-plane-net

  client-net:
    driver: bridge
    internal: true
    name: client-net

  # Client <-> IDP and Gateway -> IDP (JWKS), plus host port publishing and
  # outbound (the IDP is meant to be reachable "globally"). NOT marked
  # internal — an internal-only network cannot publish ports. The IDP stays
  # off data-plane-net, so it has no route to the resource nodes.
  idp-net:
    driver: bridge
    name: idp-net

